[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-logger"
version = "0.1.0"
description = "Structured logging library with a shared API and pluggable destinations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["logging", "structured-logging", "json"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shared_logger --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["shared_logger"]
